# Render Blueprint: one staging and one production web service.
# Each service gets its own DATABASE_URL pointing at its own Supabase project;
# enter those in the Render dashboard (sync: false keeps them out of git).
#
# Migrations run in the start command because Render's pre-deploy command is
# only available on paid instance types.

services:
  - type: web
    name: mgt656-staging
    runtime: python
    plan: free
    region: oregon        # same AWS region as the Supabase projects (us-west-2)
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: ./bin/start.sh
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: staging
      - key: TEAM_NICKNAME
        value: holy-dew
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: MAP_API_KEY       # browser map key, restricted to this domain
        sync: false
      - key: RESEND_API_KEY    # login-code email (#6)
        sync: false
      - key: EMAIL_FROM        # sender on the verified Resend domain
        sync: false
      - key: GRADER_FIXED_OTP  # fixed code for the seeded grader accounts
        sync: false
      - key: SUPABASE_STORAGE_URL
        sync: false
      - key: SUPABASE_STORAGE_KEY # server-only service_role key for this project
        sync: false
      - key: SUPABASE_PHOTO_BUCKET
        value: profile-photos

  - type: web
    name: mgt656-production
    runtime: python
    plan: free
    region: oregon        # same AWS region as the Supabase projects (us-west-2)
    branch: main
    # Production is promoted deliberately (manual deploy), never on every merge.
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: ./bin/start.sh
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: TEAM_NICKNAME
        value: holy-dew
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: MAP_API_KEY       # browser map key, restricted to this domain
        sync: false
      - key: RESEND_API_KEY    # login-code email (#6)
        sync: false
      - key: EMAIL_FROM        # sender on the verified Resend domain
        sync: false
      - key: GRADER_FIXED_OTP  # fixed code for the seeded grader accounts
        sync: false
      - key: SUPABASE_STORAGE_URL
        sync: false
      - key: SUPABASE_STORAGE_KEY # production project, separate from staging
        sync: false
      - key: SUPABASE_PHOTO_BUCKET
        value: profile-photos
