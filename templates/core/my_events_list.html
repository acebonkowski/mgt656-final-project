{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>{{ title }} · Yale Events</title>
  <link rel="stylesheet" href="{% static 'core/map.css' %}?v=ui-84">
  <link rel="stylesheet" href="{% static 'core/event.css' %}">
  <link rel="stylesheet" href="{% static 'core/my_events.css' %}?v=my-events-82b">
</head>
<body class="event-detail-page my-events-page">
<header class="event-topbar my-events-topbar">
  <a class="event-back" href="{% url 'my_events' %}" aria-label="Back to My Events">← My Events</a>
  <h1>{{ title }}</h1>
  <span aria-hidden="true"></span>
</header>
<main class="my-events-main">
  {% if filter_form %}{% include "core/_favorite_filters.html" %}{% endif %}
  {% if events %}
    <ul class="my-events-grid">
      {% for event in events %}
        <li>{% include "core/_my_event_card.html" %}</li>
      {% endfor %}
    </ul>
  {% else %}
    <p class="my-events-empty">{{ empty }}</p>
  {% endif %}
</main>
<script src="{% static 'core/favorite_filters.js' %}"></script>
</body>
</html>
