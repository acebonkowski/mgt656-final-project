<div class="profile-menu" id="profile-menu">
  <button id="profile-menu-toggle" class="profile-menu-toggle" type="button"
          aria-label="Open Profile Menu" aria-expanded="false" aria-controls="profile-menu-panel">
    <span class="profile-avatar">
      <svg class="profile-placeholder" aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="8" r="4"/><path d="M4 22v-2a8 8 0 0 1 16 0v2"/>
      </svg>
      {% if menu_photo_url %}<img id="profile-menu-photo" src="{{ menu_photo_url }}" alt="" width="40" height="40">{% endif %}
    </span>
    <svg class="profile-menu-arrow" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
    {% if incoming_friend_requests %}<span class="friend-request-badge" aria-label="{{ incoming_friend_requests }} incoming friend requests">{{ incoming_friend_requests }}</span>{% endif %}
  </button>
  <nav id="profile-menu-panel" class="profile-menu-panel" aria-label="Profile" hidden>
    <a id="profile-my-events" href="{% url 'my_events' %}">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg>
      <span>My Events</span>
    </a>
    <a href="{{ friends_menu_url }}">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="7" r="4"/><path d="M4 22v-2a8 8 0 0 1 16 0v2"/></svg>
      <span>Friends</span>
      {% if incoming_friend_requests %}<span class="friend-request-badge" aria-label="{{ incoming_friend_requests }} incoming friend requests">{{ incoming_friend_requests }}</span>{% endif %}
    </a>
    <a href="{{ settings_menu_url }}">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 3 1-2h4l1 2 3 2 2 0 2 4-1 2v2l1 2-2 4-2 0-3 2-1 2h-4l-1-2-3-2-2 0-2-4 1-2v-2L2 9l2-4h2Z"/><circle cx="12" cy="12" r="3"/></svg>
      <span>Settings</span>
    </a>
    <form class="logout" method="post" action="{% url 'accounts:logout' %}">
      {% csrf_token %}
      <button type="submit" aria-label="Log Out">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M21 12H9m7-5 5 5-5 5"/></svg>
        <span>Log Out</span>
      </button>
    </form>
  </nav>
</div>
