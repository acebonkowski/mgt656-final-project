{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Yale Events</title>
  <link rel="stylesheet" href="{% static 'core/map.css' %}">
  <link rel="stylesheet" href="{% static 'core/event.css' %}">
</head>
<body class="event-detail-page">
  <header class="event-topbar"><a class="event-back" href="{% url 'map' %}">← Map</a></header>
  <main class="event-main"><h1>{{ title }}</h1>
    {% if username %}<p id="my-username">You're <strong>@{{ username }}</strong> · <a href="{% url 'username' %}">Change username</a></p>{% endif %}
    <p>{{ message }}</p></main>
</body>
</html>
