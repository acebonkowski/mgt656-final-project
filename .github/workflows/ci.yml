name: CI

# Lint and test on every pull request and every push to main (#43).
# Render deploys staging only after this passes on main (autoDeployTrigger:
# checksPass), and "Promote to production" calls it before deploying.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Throwaway Postgres for the test run, same engine as Supabase. Full-text
      # search (#35) is Postgres-only. Trust auth on a container that exists
      # only for this job, so no password is needed or committed.
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: mgt656
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Dev secret key and no SSL (DJANGO_DEBUG), Postgres from the service
      # above. Tests mock the LLM and every external service, so no secrets
      # are needed here.
      DJANGO_DEBUG: "true"
      DATABASE_URL: postgres://postgres@localhost:5432/mgt656
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check --output-format=github .

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test
